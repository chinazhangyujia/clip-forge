[package]
name = "clipforge-desktop"
version = "0.1.0"
edition = "2021"
authors = ["ClipForge"]
description = "ClipForge desktop shell"
license = ""
repository = ""
default-run = "clipforge-desktop"

[lib]
name = "clipforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
